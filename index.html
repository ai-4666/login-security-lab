<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>로그인 보안 비교 실험</title>
<style>body{font:17px system-ui;background:#eef3fa;color:#172b4d;max-width:850px;margin:45px auto;padding:20px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}label{display:block;margin:15px 0}input{padding:10px;font:inherit;width:90%}button{padding:12px;background:#2457d6;color:white;border:0;border-radius:7px;cursor:pointer}pre{white-space:pre-wrap}small{color:#52627a}</style>
<h1>웹 로그인 시스템 보안 실험</h1>
<p>같은 입력이 SQL 구성 방식에 따라 어떻게 처리되는지 비교합니다.</p>
<section><strong>실습 전용</strong><p>가상 계정만 사용하세요. 이 프로그램은 실제 서비스용 인증 시스템이 아닙니다.</p><small>정상 계정: student / demo-pass · 우회 실험 아이디: student' -- · 비밀번호: wrong</small></section>
<section><label>아이디<input id="username" value="student"></label><label>비밀번호<input id="password" value="demo-pass" type="password"></label><button id="run">두 방식 비교하기</button><pre id="output" aria-live="polite">결과가 여기에 표시됩니다.</pre></section>
<section><h2>핵심 원리</h2><p>문자열 연결은 입력이 SQL 구문에 영향을 줄 수 있습니다. 매개변수화 쿼리는 SQL 구조와 입력 데이터를 분리합니다.</p></section>
<script>
document.querySelector('#run').onclick=async()=>{
 const fields=new URLSearchParams({username:document.querySelector('#username').value,password:document.querySelector('#password').value});
 const results={};
 try{
 for(const mode of ['vulnerable','secure']){
 const response=await fetch('/login/'+mode,{method:'POST',body:fields});
 if(!response.ok)throw new Error('HTTP '+response.status);
 results[mode]=await response.json();
 }
 document.querySelector('#output').textContent=JSON.stringify(results,null,2);
 }catch(error){document.querySelector('#output').textContent='실험 요청 실패: '+error.message;}
};
</script></html>
